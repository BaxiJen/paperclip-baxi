<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf8f2" />
    <meta name="apple-mobile-web-app-title" content="BaXiJen" />
    <title>BaXiJen</title>
    <!-- PAPERCLIP_RUNTIME_BRANDING_START -->
    <!-- PAPERCLIP_RUNTIME_BRANDING_END -->
    <!-- PAPERCLIP_FAVICON_START -->
    <link rel="icon" href="/baxijen.svg" type="image/svg+xml" />
    <!-- PAPERCLIP_FAVICON_END -->
    <link rel="apple-touch-icon" href="/baxijen.svg" />
    <link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials" />
    <script>
      (() => {
        const key = "paperclip.theme";
        const darkThemeColor = "#1a1815";
        const lightThemeColor = "#faf8f2";
        try {
          const stored = window.localStorage.getItem(key);
          const fallback = "light";
          const theme = stored === "light" || stored === "dark" ? stored : fallback;
          const isDark = theme === "dark";
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
          const themeColorMeta = document.querySelector('meta[name="theme-color"]');
          if (themeColorMeta) {
            themeColorMeta.setAttribute("content", isDark ? darkThemeColor : lightThemeColor);
          }
        } catch {
          document.documentElement.classList.remove("dark");
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
